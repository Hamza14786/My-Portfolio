    <rect x="568" y="246" width="262" height="182" rx="24" fill="#0f172a" />
    <path d="M699 285v92M654 377h90" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <path d="M622 330h154" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" opacity=".9" />
    <text x="622" y="414" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Justice Workflow</text>
  </g>
</svg>
