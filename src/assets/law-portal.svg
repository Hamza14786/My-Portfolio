<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Law Portal dashboard preview</title>
  <desc id="desc">A polished legal services portal dashboard with case cards, documents, and status panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset=".52" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="panel" x1="140" y1="92" x2="1040" y2="658" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".94" />
      <stop offset="1" stop-color="#dbeafe" stop-opacity=".86" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".35" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)" />
  <circle cx="976" cy="102" r="170" fill="#22d3ee" opacity=".14" />
  <circle cx="156" cy="678" r="230" fill="#60a5fa" opacity=".16" />
  <g opacity=".18" stroke="#fff">
    <path d="M0 142h1200M0 284h1200M0 426h1200M0 568h1200" />
    <path d="M150 0v750M300 0v750M450 0v750M600 0v750M750 0v750M900 0v750M1050 0v750" />
  </g>
  <rect x="130" y="88" width="940" height="574" rx="34" fill="url(#panel)" filter="url(#shadow)" />
  <rect x="130" y="88" width="940" height="76" rx="34" fill="#0f172a" />
  <path d="M130 130h940" stroke="#334155" />
  <circle cx="184" cy="126" r="11" fill="#38bdf8" />
  <circle cx="222" cy="126" r="11" fill="#60a5fa" />
  <circle cx="260" cy="126" r="11" fill="#93c5fd" />
  <text x="318" y="135" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Law Portal</text>
  <rect x="820" y="108" width="184" height="36" rx="18" fill="#1d4ed8" />
  <text x="852" y="132" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">New Case</text>
  <g transform="translate(176 200)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Legal Case Dashboard</text>
    <text x="0" y="34" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Client intake, filings, documents, and hearing status in one secure workspace.</text>
    <rect x="0" y="78" width="254" height="132" rx="22" fill="#eff6ff" stroke="#bfdbfe" />
    <rect x="288" y="78" width="254" height="132" rx="22" fill="#ecfeff" stroke="#a5f3fc" />
    <rect x="576" y="78" width="254" height="132" rx="22" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="24" y="120" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Active Cases</text>
    <text x="24" y="170" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">42</text>
    <text x="312" y="120" fill="#0e7490" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Documents</text>
    <text x="312" y="170" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">128</text>
    <text x="600" y="120" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Hearings</text>
    <text x="600" y="170" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">16</text>
    <rect x="0" y="246" width="530" height="182" rx="24" fill="#fff" stroke="#dbeafe" />
    <text x="26" y="286" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Recent Matters</text>
    <g fill="#e2e8f0">
      <rect x="26" y="318" width="470" height="12" rx="6" />
      <rect x="26" y="354" width="410" height="12" rx="6" />
      <rect x="26" y="390" width="448" height="12" rx="6" />
    </g>
    <g fill="#2563eb">
      <rect x="438" y="310" width="58" height="28" rx="14" opacity=".85" />
      <rect x="438" y="346" width="58" height="28" rx="14" opacity=".65" />
      <rect x="438" y="382" width="58" height="28" rx="14" opacity=".45" />
