    <text x="330" y="428" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Vehicle</text>
    <text x="598" y="428" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Status</text>
