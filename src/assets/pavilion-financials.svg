<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Pavilion Financials dashboard preview</title>
  <desc id="desc">A financial dashboard preview with portfolio charts, revenue cards, and investment analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554" />
      <stop offset=".5" stop-color="#0f766e" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="panel" x1="130" y1="88" x2="1070" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".96" />
      <stop offset="1" stop-color="#ecfeff" stop-opacity=".9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".38" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)" />
  <circle cx="998" cy="118" r="180" fill="#67e8f9" opacity=".14" />
  <circle cx="180" cy="648" r="230" fill="#22c55e" opacity=".12" />
