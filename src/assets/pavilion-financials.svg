    <text x="24" y="124" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Revenue</text>
    <text x="24" y="174" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">$84K</text>
    <text x="316" y="124" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Assets</text>
    <text x="316" y="174" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">$1.2M</text>
    <text x="608" y="124" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Growth</text>
    <text x="608" y="174" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">18%</text>
